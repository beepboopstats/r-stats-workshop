name: Render and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for actions/deploy-pages to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight run, but never cancel a
# deploy that is already underway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must match the R version pinned in renv.lock, or renv will
      # warn and may resolve different package binaries.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      # Restores from renv.lock and caches the library, keyed on the
      # lockfile hash -- so this step is slow once, then near-instant
      # until a dependency actually changes.
      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
