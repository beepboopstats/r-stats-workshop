project:
  type: website
  execute-dir: project
  output-dir: docs
  render:
    - index.qmd
    - 404.qmd
    - content/*.qmd
  resources:
    - data/
    - scripts/

execute:
  echo: true       # this is a teaching site -- code is the content
  warning: true    # participants should see the warnings they will hit
  message: false

website:
  title: "R + Statistics Workshop"
  google-analytics: "G-LXSX23EQ95"
  description: "A four-part workshop series teaching R programming and statistics with longitudinal study data, for ABCD research staff and consortium members."
  site-url: https://www.beepboopstats.com/r-stats-workshop
  favicon: assets/img/favicon.png
  # Default social-share card for any page that does not set its own `image`.
  image: assets/img/poster-header.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  reader-mode: false
  page-footer:
    left: "Das & Moore, 2026"
    right: "R and Statistics Workshop for ABCD community"
  navbar:
    pinned: true
    search: true
    left:
      - text: "Home"
        file: index.qmd
      - text: "M0.Setup"
        file: content/module0.qmd
      - text: "M1.Foundations"
        file: content/module1.qmd
      - text: "Deep Dive"
        menu:
          - text: "The ABCD-shaped dataset"
            file: content/data.qmd
          - text: "Data types in R"
            file: content/module1-data-types.qmd
          - text: "Plot gallery"
            file: content/module1-plot-gallery.qmd
      - text: "Upcoming"
        menu:
          - text: "M2.Data Exploration & Visualization"
            file: content/module2.qmd
          - text: "M3.Inferential Statistics"
            file: content/module3.qmd
          - text: "M4.Applied Projects"
            file: content/module4.qmd
    tools:
      - icon: github
        href: https://github.com/beepboopstats/r-stats-workshop

format:
  html:
    theme:
      light:
        - pulse
        - assets/css/styles.scss
      dark:
        - darkly
        - assets/css/styles.scss
    css: assets/css/styles.scss
    fontsize: 1.1em
    toc: true
    toc-depth: 3
    toc-location: left
    toc-expand: 1
    code-fold: false      # never hide teaching code
    code-copy: true
    code-overflow: wrap
    code-link: false
    df-print: default
    # GitHub Pages serves both /page.html and /page/ -- canonical tags stop
    # search engines treating those as duplicate content.
    canonical-url: true
    link-external-newwindow: true

format-links: []
